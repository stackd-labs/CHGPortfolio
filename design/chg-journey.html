<style>
body{margin:0;background:#1E1A17;font-family:'Geist',ui-sans-serif,system-ui,sans-serif;color:#211C18}
a{color:#B8466E}a:hover{color:#8E2F52}
*{box-sizing:border-box}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace}
.stage{position:relative;width:1440px;height:900px;overflow:hidden;background:#1E1A17;-webkit-font-smoothing:antialiased}

/* ---------- OFFICE ---------- */
.office{position:absolute;inset:0;transform-origin:760px 422px;transition:transform 1.8s cubic-bezier(.7,0,.12,1);will-change:transform}
.office.zoom{transform:scale(4.7)}
.fadeout{transition:opacity .5s ease}
.office.zoom .fadeout{opacity:0;pointer-events:none}
.o-in{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.2s + var(--i,0) * 120ms)}
.dust{animation:dust 9s ease-in-out infinite}
.steam{animation:steam 3.2s ease-in-out infinite;opacity:0}
.sway{transform-origin:1118px 600px;animation:sway 6s ease-in-out infinite}
.sway2{transform-origin:1340px 420px;animation:sway 7s ease-in-out 1s infinite}
.glowp{animation:glowp 5s ease-in-out infinite}
.sec{transform-origin:1360px 180px;animation:spin 60s linear infinite}
.screen{position:absolute;left:572px;top:312px;width:376px;height:221px;border:0;padding:0;border-radius:4px;overflow:hidden;background:#1E1A17;cursor:pointer;transition:box-shadow .3s}
.screen:hover{box-shadow:0 0 0 2px #D9A94E,0 0 60px rgba(217,169,78,.55)}
.screen:focus-visible{outline:3px solid #B8466E;outline-offset:6px}
.scr-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:scrDraw 4s cubic-bezier(.6,0,.2,1) infinite}
.enter-tag{position:absolute;left:640px;top:236px;width:240px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:bob 2.6s ease-in-out infinite;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font:500 14px 'Geist',system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s,box-shadow .2s,border-color .2s}
.btn-p{background:#B8466E;color:#fff;border:1px solid #B8466E;box-shadow:0 12px 28px -14px rgba(184,70,110,.9)}
.btn-p:hover{background:#9E3A5E;color:#fff;transform:translateY(-2px)}
.btn-s{background:transparent;color:#211C18;border:1px solid rgba(33,28,24,.35)}
.btn-s:hover{border-color:#211C18;color:#211C18;transform:translateY(-2px)}
.btn-d{background:transparent;color:#EDE4D6;border:1px solid rgba(237,228,214,.28)}
.btn-d:hover{border-color:#D9A94E;color:#fff;transform:translateY(-2px)}
.pulse{width:8px;height:8px;border-radius:50%;background:#3F8F5F;animation:pulse 2s ease-out infinite;flex-shrink:0}

/* ---------- INSIDE ---------- */
.inside{position:absolute;inset:0;background:#1E1A17;color:#EDE4D6;animation:fadeIn .5s ease both}
.idots{position:absolute;inset:-40px;background-image:radial-gradient(rgba(237,228,214,.10) 1px,transparent 1.3px);background-size:30px 30px;animation:drift 50s linear infinite}
.map{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;transition:transform 1.3s cubic-bezier(.65,0,.2,1)}
.route-in{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards}
.flow{stroke-dasharray:.4 2.6;animation:flow 6s linear infinite}
.sat{opacity:0;animation:fadeIn .8s ease forwards;animation-delay:2s}
.node{position:absolute;width:220px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .6s}
.nbtn{position:relative;width:72px;height:72px;border-radius:50%;border:1px solid rgba(217,169,78,.7);background:#26211D;color:#EDE4D6;display:grid;place-items:center;cursor:pointer;font:500 15px 'Geist Mono',ui-monospace,monospace;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s}
.nbtn::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(217,169,78,.35);animation:ring 2.4s ease-out infinite}
.nbtn:hover{transform:scale(1.1);box-shadow:0 0 40px rgba(217,169,78,.4)}
.nbtn:focus-visible{outline:3px solid #E7A3BC;outline-offset:6px}
.node.done .nbtn{background:#D9A94E;color:#1E1A17;border-color:#D9A94E}
.node.done .nbtn::before{animation:none;opacity:0}
.node.cur .nbtn{background:#B8466E;color:#fff;border-color:#E7A3BC;box-shadow:0 0 50px rgba(184,70,110,.6)}
.node.dim{opacity:.35}
.nlab{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.you{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:#E7A3BC;box-shadow:0 0 0 6px rgba(184,70,110,.3),0 0 30px rgba(231,163,188,.8);offset-rotate:0deg;offset-anchor:center;transition:offset-distance 1.3s cubic-bezier(.65,0,.2,1);z-index:3;pointer-events:none}
.packet{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;background:#D9A94E;box-shadow:0 0 16px #D9A94E;offset-rotate:0deg;offset-anchor:center;animation:travel 9s linear infinite;pointer-events:none}
.packet.p2{animation-delay:-4.5s;background:#E7A3BC;box-shadow:0 0 16px #E7A3BC}
.topbar{position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(#1E1A17 55%,rgba(30,26,23,0));display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:20}
.ibtn{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(237,228,214,.22);background:rgba(30,26,23,.6);color:#EDE4D6;font:500 12px 'Geist',system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,background .2s;min-height:44px}
.ibtn:hover{border-color:#D9A94E;background:rgba(217,169,78,.1)}
.ipill{min-height:44px;height:36px;padding:0 16px;border-radius:999px;border:1px solid #B8466E;background:#B8466E;color:#fff;font:500 12px 'Geist',system-ui,sans-serif;cursor:pointer}
.ipill:hover{background:#9E3A5E}
.intro{position:absolute;left:64px;top:548px;width:410px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) 1.9s both;z-index:5}
.bootline{position:absolute;left:50%;top:80px;transform:translateX(-50%);display:flex;gap:22px;font:500 11px 'Geist Mono',ui-monospace,monospace;letter-spacing:.08em;color:#B9AE9F;z-index:4;pointer-events:none}
.bootline span{opacity:0;animation:blinkIn 3.6s ease forwards}
.rail{position:absolute;left:64px;right:64px;bottom:22px;height:56px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;z-index:20;animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) 2.2s both}
.rb{position:relative;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;border:1px solid rgba(237,228,214,.14);background:rgba(38,33,29,.85);color:#B9AE9F;cursor:pointer;font:500 13px 'Geist',system-ui,sans-serif;text-align:left;overflow:hidden;transition:border-color .2s,color .2s}
.rb:hover{border-color:rgba(217,169,78,.6);color:#EDE4D6}
.rb .n{font:500 11px 'Geist Mono',ui-monospace,monospace;color:#D9A94E}
.rb .bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:#D9A94E;transition:width .6s}
.rb.done{color:#EDE4D6}.rb.done .bar{width:100%}
.rb.cur{color:#fff;border-color:#B8466E;background:rgba(184,70,110,.18)}.rb.cur .bar{width:100%;background:#E7A3BC}

/* ---------- PANEL ---------- */
.panel{position:absolute;left:600px;top:76px;width:800px;height:726px;background:#FAF6EF;color:#211C18;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.7),0 0 0 1px rgba(217,169,78,.35);animation:panelIn .9s cubic-bezier(.2,.9,.2,1) .35s both;z-index:10}
.ph{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 28px;border-bottom:1px solid rgba(33,28,24,.1)}
.pbody{flex:1;min-height:0;overflow:auto;padding:28px 36px}
.pbody::-webkit-scrollbar{width:10px}.pbody::-webkit-scrollbar-thumb{background:rgba(33,28,24,.18);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.pf{height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px 0 20px;border-top:1px solid rgba(33,28,24,.1);background:#F4EEE4}
.swap{display:flex;flex-direction:column;gap:20px;animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.pbtn{min-height:44px;height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(33,28,24,.2);background:transparent;color:#211C18;font:500 13px 'Geist',system-ui,sans-serif;cursor:pointer}
.pbtn:hover{border-color:#211C18}
.eyebrow{font:500 11px 'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#7E5E22}
.chip{font:500 11px 'Geist Mono',ui-monospace,monospace;padding:5px 10px;border-radius:999px;border:1px solid rgba(33,28,24,.16);color:#211C18;background:#FFFDF9;white-space:nowrap}
.sel{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(33,28,24,.16);background:#FFFDF9;color:#211C18;font:500 13px 'Geist',system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.sel:hover{border-color:#211C18}
.sel.on{background:#211C18;color:#F4EEE4;border-color:#211C18}
.card{padding:16px;border-radius:14px;border:1px solid rgba(33,28,24,.12);background:#FFFDF9;display:flex;flex-direction:column;gap:6px}
.scan{position:absolute;left:0;right:0;height:60px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:scan 3.2s ease-in-out infinite;pointer-events:none}
.bob{animation:bob 4s ease-in-out infinite}.bob2{animation:bob 4s ease-in-out 1.2s infinite}.bob3{animation:bob 4s ease-in-out 2.4s infinite}
.grow{transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:500 11px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#6B5E53}
.field input,.field textarea{font:400 14px 'Geist',system-ui,sans-serif;color:#211C18;background:#FFFDF9;border:1px solid rgba(33,28,24,.18);border-radius:10px;padding:12px 14px;outline:none;resize:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:#A9803A;box-shadow:0 0 0 3px rgba(169,128,58,.18)}
.soc{font:500 12px 'Geist Mono',ui-monospace,monospace;color:#211C18;text-decoration:none;padding:0 12px;min-height:44px;display:inline-flex;align-items:center;border-radius:10px;border:1px solid rgba(33,28,24,.14)}
.soc:hover{border-color:#B8466E;color:#B8466E}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translate(30px,30px)}}
@keyframes dust{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(26px,-40px);opacity:.8}}
@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.55}100%{transform:translateY(-22px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes glowp{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,143,95,.55)}100%{box-shadow:0 0 0 10px rgba(63,143,95,0)}}
@keyframes scrDraw{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-30}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes blinkIn{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}
@keyframes panelIn{from{opacity:0;transform:translateX(80px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scan{0%{top:-60px}100%{top:100%}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.stage *,.stage *::before{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important}}

/* ---------- standalone page shell ---------- */
html,body{height:100%}
body{overflow:hidden}
.viewport{position:fixed;inset:0;display:grid;place-items:center;background:#1E1A17}
.stage{transform-origin:center center;flex-shrink:0}
[hidden]{display:none !important}
</style>

(function () {

    { cat: 'RESCUE & REBUILD', name: 'Bounce FX', mono: 'BFX', tint: '#8C6A28', domain: 'bouncefxpartyrentals.com', url: 'https://www.bouncefxpartyrentals.com/',
      desc: 'Moved a party rental business off Squarespace onto a custom booking site and admin portal: live inventory, bundle slots, Stripe checkout, and a CRM built from their old order history.',
      outcome: 'Booking, payments, and admin in one system they own.', tags: ['Next.js', 'Stripe', 'Admin Portal'] },
    { cat: 'APPRENTICESHIP MANAGEMENT', name: 'PathBuilders', mono: 'PB', tint: '#3E6A7A', domain: 'pathbuilders.vercel.app', url: 'https://pathbuilders.vercel.app/',
      desc: 'Apprenticeship management platform for HVAC, electrical, and plumbing programs. Admin, instructor, employer, and apprentice portals with OJT timesheets, attendance, and hour ledgers. Public mock with fictional data, so click around.',
      outcome: '247 mock apprentices, 62 employers, one connected system.', tags: ['Next.js 16', 'React 19', 'Data Modeling'] },
    { cat: 'INSURANCE OPERATIONS PLATFORM', name: 'Villa Concierge Co', mono: 'VC', tint: '#211C18', domain: 'villa-group-conceirge2.vercel.app', url: 'https://villa-group-conceirge2.vercel.app/',
      desc: 'Operations system for an insurance relocation housing firm. Placements, housing inventory, carrier and adjuster contacts, and billing for ALE claims in one interface.',
      outcome: 'Replaced 3 separate tools with one unified platform.', tags: ['Operations', 'React', 'Supabase'] },
    { cat: 'AI PERSONAL GROWTH APP', name: 'Seal the Leak', mono: 'STL', tint: '#6E4A7E', domain: 'nicolesprojectapp.vercel.app', url: 'https://nicolesprojectapp.vercel.app/',
      desc: 'A daily clarity app and step-by-step reset program personalized to your energy archetype, with AI-generated daily guidance.',
      outcome: '365 AI-personalized daily cards delivered on demand.', tags: ['AI', 'Next.js', 'Supabase'] },
    { cat: 'AI BUILD LAB', name: 'Stackd Studios', mono: 'SS', tint: '#4F6B49', domain: 'stackdstudiosai.com', url: 'https://www.stackdstudiosai.com/',
      desc: 'My build lab. Where I design and ship AI products, agent tooling, and client systems, from first idea to live product.',
      outcome: 'Idea to live product in under 6 weeks.', tags: ['Strategy', 'Product', 'AI'] }
  ];
  var STACK = [
    { name: 'AI & Agents', items: [['Claude (Anthropic)', 'Opus · Sonnet · Haiku'], ['Claude Agent SDK', 'Tool use · Caching · Agents'], ['Claude Code', 'Skills · Hooks · Subagents'], ['Multi-Agent Orchestration', 'Lead + worker harnesses'], ['MCP', 'Custom servers & integrations'], ['Vercel AI SDK', 'Streaming · UI integration'], ['OpenAI · Gemini', 'When the job calls for it']] },
    { name: 'Frontend', items: [['Next.js', 'App Router · 14 to 16'], ['React', '18 & 19 · Server Components'], ['TypeScript', 'Type-safe everything'], ['Tailwind CSS', 'v3 & v4'], ['shadcn/ui + Radix', 'Accessible components'], ['Framer Motion', 'Animation & transitions'], ['Recharts', 'Dashboards & reporting']] },
    { name: 'Backend & Data', items: [['Supabase', 'Postgres · Auth · Storage'], ['Row-Level Security', 'Multi-role access done right'], ['PostgreSQL', 'Schema design · migrations'], ['Node.js', 'API routes · server actions'], ['Webhooks & Intake Pipes', 'System-to-system data'], ['Python', 'Scripting · data jobs']] },
    { name: 'Payments & Comms', items: [['Stripe', 'Checkout · Webhooks · Subscriptions'], ['PayPal', 'Vaulted cards · Invoicing'], ['Resend', 'Transactional & campaign email'], ['Google Workspace', 'Sheets · Drive · Gmail APIs']] },
    { name: 'Deploy & Ops', items: [['Vercel', 'Hosting · CI/CD · Env'], ['GitHub', 'Version control · Actions'], ['Cloudflare', 'DNS · Workers'], ['Security Hardening', 'Auth · RLS · dependency audits']] },
    { name: 'Games & 3D', items: [['Phaser 3', '2D sims · React + Vite'], ['Unity', '3D management sims'], ['Roblox (Luau)', 'Rojo toolchain'], ['Blender', 'Assets & scene work']] }
  ];

  /* ================= STATE ================= */
  var state = { scene: 'office', zooming: false, stop: -1, last: -1, visited: {}, project: 0, tab: 0 };
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  /* ================= FIT STAGE TO WINDOW ================= */
  var stage = $('#stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ================= OFFICE CLOCK ================= */
  function tick() {
    var d = new Date(), m = d.getMinutes(), h = d.getHours() % 12;
    var hh = $('#hourHand'), mm = $('#minHand');
    if (hh) hh.setAttribute('transform', 'rotate(' + (h * 30 + m * 0.5) + ' 1360 180)');
    if (mm) mm.setAttribute('transform', 'rotate(' + (m * 6) + ' 1360 180)');
  }
  tick();
  setInterval(tick, 15000);

  /* ================= SCENE CHANGES ================= */
  var officeScene = $('#officeScene'), office = $('#office'), mount = $('#insideMount');

  function enter() {
    if (state.zooming) return;
    state.zooming = true;
    office.classList.add('zoom');
    setTimeout(function () {
      officeScene.hidden = true;
      mount.innerHTML = '';
      mount.appendChild($('#tpl-inside').content.cloneNode(true));
      state.scene = 'inside';
      state.stop = -1;
      buildInside();
      render();
      state.zooming = false;
    }, 1700);
  }

  function exit() {
    state.scene = 'office';
    state.stop = -1;
    mount.innerHTML = '';
    officeScene.hidden = false;
    office.classList.add('zoom');
    void office.offsetWidth;               // lock in the zoomed frame
    requestAnimationFrame(function () { office.classList.remove('zoom'); });
  }

  /* ================= INSIDE: BUILD ================= */
  function buildInside() {
    var nodes = $('#nodes'), rail = $('#rail');
    STOPS.forEach(function (s, i) {
      var n = el('div', 'node');
      n.style.left = (s.x - 110) + 'px';
      n.style.top = (s.y - 36) + 'px';
      n.style.animationDelay = (1.1 + i * 0.14).toFixed(2) + 's';
      var b = el('button', 'nbtn', s.num);
      b.setAttribute('aria-label', 'Go to stop ' + s.num + ', ' + s.name);
      b.dataset.action = 'go'; b.dataset.stop = i;
      var lab = el('div', 'nlab');
      var t1 = el('span', null, s.name); t1.style.cssText = 'font-size:16px;font-weight:600;color:#EDE4D6';
      var t2 = el('span', 'mono', s.teaser); t2.style.cssText = 'font-size:11px;color:#B9AE9F';
      lab.append(t1, t2);
      n.append(b, lab);
      nodes.appendChild(n);

      var r = el('button', 'rb');
      r.dataset.action = 'go'; r.dataset.stop = i;
      r.append(el('span', 'n', s.num), el('span', null, s.name), el('span', 'bar'));
      rail.appendChild(r);
    });
  }

  /* ================= INSIDE: RENDER ================= */
  function go(i) {
    var changed = state.stop !== i;
    state.stop = i; state.last = i; state.visited[i] = true;
    render(changed);
  }

  function render(swapContent) {
    if (state.scene !== 'inside') return;
    var stop = state.stop, here = stop >= 0 ? stop : state.last;
    var visitedCount = Object.keys(state.visited).length;

    // map pan + traveller
    var map = $('#map');
    map.style.transform = stop >= 0 ? 'translate(' + (290 - STOPS[stop].x) + 'px,' + (440 - STOPS[stop].y) + 'px)' : 'translate(0px,0px)';
    var pct = here >= 0 ? ROUTE_PCT[here] : 0;
    $('#you').style.offsetDistance = pct + '%';
    $('#progressPath').style.strokeDashoffset = 100 - pct;

    // nodes + rail
    document.querySelectorAll('#nodes .node').forEach(function (n, i) {
      n.classList.toggle('cur', stop === i);
      n.classList.toggle('done', stop !== i && !!state.visited[i]);
      n.classList.toggle('dim', stop >= 0 && stop !== i);
    });
    document.querySelectorAll('#rail .rb').forEach(function (r, i) {
      r.classList.toggle('cur', stop === i);
      r.classList.toggle('done', stop !== i && !!state.visited[i]);
    });

    // top bar
    $('#crumb').textContent = stop >= 0 ? '/' + STOPS[stop].num + '-' + STOPS[stop].id : '';
    $('#progress').textContent = visitedCount + ' / 6 explored';

    // intro card
    var nextUnseen = 0; while (nextUnseen < 5 && state.visited[nextUnseen]) nextUnseen++;
    $('#intro').hidden = stop >= 0;
    $('#startLabel').textContent = visitedCount === 0 ? 'Start the journey' : (visitedCount >= 6 ? 'Revisit the journey' : 'Continue to ' + STOPS[nextUnseen].name);

    // panel
    var panel = $('#panel');
    if (stop < 0) { panel.hidden = true; return; }
    if (panel.hidden) { panel.hidden = false; swapContent = true; }
    var s = STOPS[stop];
    $('#panelNum').textContent = 'STOP ' + s.num + ' / 06';
    $('#panelTitle').textContent = s.title;
    panel.setAttribute('aria-label', s.name);
    var prev = $('#prevBtn');
    prev.hidden = stop === 0;
    if (stop > 0) prev.textContent = '← ' + STOPS[stop - 1].name;
    $('#nextBtn').hidden = stop === 5;
    if (stop < 5) $('#nextLabel').textContent = 'Next stop: ' + STOPS[stop + 1].name;
    $('#endBtn').hidden = stop !== 5;

    if (swapContent) {
      var body = $('#pbody');
      body.innerHTML = '';
      body.scrollTop = 0;
      body.appendChild($('#tpl-' + s.id).content.cloneNode(true));
      if (s.id === 'work') renderWork();
      if (s.id === 'stack') renderStack();
    }
  }

  function renderWork() {
    var body = $('#pbody'), p = PROJECTS[state.project];
    var chips = $('[data-slot="projectChips"]', body);
    chips.innerHTML = '';
    PROJECTS.forEach(function (pr, i) {
      var b = el('button', 'sel' + (i === state.project ? ' on' : ''), pr.name);
      b.dataset.action = 'project'; b.dataset.index = i;
      chips.appendChild(b);
    });
    ['domain', 'mono', 'cat', 'name', 'desc', 'outcome'].forEach(function (k) { $('[data-slot="' + k + '"]', body).textContent = p[k]; });
    body.querySelectorAll('[data-tint="bg"]').forEach(function (n) { n.style.background = p.tint; });
    var tags = $('[data-slot="tags"]', body); tags.innerHTML = '';
    p.tags.forEach(function (t) { tags.appendChild(el('span', 'chip', t)); });
    $('[data-slot="url"]', body).href = p.url;
  }

  function renderStack() {
    var body = $('#pbody'), t = STACK[state.tab];
    $('[data-slot="tabName"]', body).textContent = t.name;
    var chips = $('[data-slot="tabChips"]', body); chips.innerHTML = '';
    STACK.forEach(function (tb, i) {
      var b = el('button', 'sel' + (i === state.tab ? ' on' : ''), tb.name);
      b.dataset.action = 'tab'; b.dataset.index = i;
      chips.appendChild(b);
    });
    var items = $('[data-slot="items"]', body); items.innerHTML = '';
    t.items.forEach(function (it) {
      var c = el('div');
      c.style.cssText = 'padding:14px 16px;border-radius:12px;border:1px solid rgba(33,28,24,.12);background:#FFFDF9;display:flex;align-items:center;justify-content:space-between;gap:12px';
      var l = el('div'); l.style.cssText = 'display:flex;flex-direction:column;gap:3px';
      var n = el('span', null, it[0]); n.style.cssText = 'font-size:14px;font-weight:600';
      var d = el('span', 'mono', it[1]); d.style.cssText = 'font-size:11px;color:#6B5E53';
      l.append(n, d);
      var dot = el('span'); dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:#3F8F5F;flex-shrink:0';
      c.append(l, dot);
      items.appendChild(c);
    });
  }

  /* ================= EVENTS ================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;
    if (a === 'enter') enter();
    else if (a === 'exit') exit();
    else if (a === 'go') go(+t.dataset.stop);
    else if (a === 'start') {
      var n = Object.keys(state.visited).length, i = 0;
      while (i < 5 && state.visited[i]) i++;
      go(n >= 6 ? 0 : i);
    }
    else if (a === 'map') { state.stop = -1; render(); }
    else if (a === 'prev') { if (state.stop > 0) go(state.stop - 1); }
    else if (a === 'next') { if (state.stop < 5) go(state.stop + 1); }
    else if (a === 'project') { state.project = +t.dataset.index; renderWork(); }
    else if (a === 'tab') { state.tab = +t.dataset.index; renderStack(); }
  });

  // Deep link: add #inside to the URL to skip the office.
  if (location.hash === '#inside') {
    office.classList.add('zoom');
    state.zooming = false;
    officeScene.hidden = true;
    mount.appendChild($('#tpl-inside').content.cloneNode(true));
    state.scene = 'inside';
    buildInside(); render();
  }
})();
</script>
